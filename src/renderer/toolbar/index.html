<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLA Browser</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #000; color: #ededed; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-rows: 34px 42px auto; align-content: start; background: #000; user-select: none; }
      button { font: inherit; }
      svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      #tabs { position: relative; display: flex; align-items: stretch; min-width: 0; padding-left: 74px; border-bottom: 1px solid #262626; -webkit-app-region: drag; }
      #brand { position: absolute; top: 0; left: 0; display: grid; width: 74px; height: 33px; place-items: center; border-right: 1px solid #262626; }
      #brand img { width: 47px; height: auto; opacity: .94; }
      #tab-list { display: flex; min-width: 0; overflow: hidden; }
      .tab { -webkit-app-region: no-drag; position: relative; display: flex; align-items: center; gap: 7px; width: 176px; max-width: 24vw; min-width: 96px; padding: 0 9px 0 11px; border: 0; border-right: 1px solid #262626; background: #000; color: #888; cursor: pointer; transition: background .14s ease, color .14s ease; }
      .tab:hover { background: #111; color: #ddd; }
      .tab.active { background: #171717; color: #fafafa; }
      .tab.active::before { position: absolute; right: 0; bottom: -1px; left: 0; height: 1px; background: #fafafa; content: ""; }
      .tab.dragging { opacity: .35; }
      .tab.drag-before { box-shadow: inset 2px 0 #fafafa; }
      .tab.drag-after { box-shadow: inset -2px 0 #fafafa; }
      .tab-status { width: 7px; height: 7px; flex: 0 0 auto; border: 1px solid #666; border-radius: 50%; transition: border-color .14s ease; }
      .tab.loading .tab-status { border-color: #fff #fff #555 #555; animation: spin .8s linear infinite; }
      .tab-title { overflow: hidden; flex: 1; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; letter-spacing: -0.01em; }
      .icon-button { display: inline-grid; width: 28px; height: 28px; place-items: center; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #a3a3a3; cursor: pointer; transition: background .14s ease, color .14s ease, transform .12s ease; }
      .icon-button:hover { background: #262626; color: #fff; }
      .close { width: 20px; height: 20px; opacity: 0; }
      .tab:hover .close, .tab.active .close { opacity: 1; }
      .new-tab { -webkit-app-region: no-drag; align-self: center; margin-left: 4px; }
      #window-controls { display: flex; margin-left: auto; -webkit-app-region: no-drag; }
      .window-control { display: inline-grid; width: 46px; place-items: center; padding: 0; border: 0; background: transparent; color: #a3a3a3; cursor: pointer; transition: background .14s ease, color .14s ease; }
      .window-control:hover { background: #262626; color: #fff; }
      .window-control.close-window:hover { background: #e5484d; color: #fff; }
      .window-control svg { width: 13px; height: 13px; stroke-width: 1.5; }
      #bar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid #262626; background: #000; }
      .control { color: #888; }
      .control:active { transform: scale(.94); }
      form { flex: 1; min-width: 0; }
      #address { width: 100%; height: 30px; padding: 0 12px; border: 1px solid #333; border-radius: 6px; outline: none; background: #171717; color: #f5f5f5; font-size: 12px; letter-spacing: -0.01em; transition: border-color .12s, background .12s; }
      #address::placeholder { color: #777; }
      #address:hover { border-color: #4a4a4a; }
      #address:focus { border-color: #fafafa; background: #0a0a0a; box-shadow: 0 0 0 2px #ffffff1f; }
      #suggestions { display: none; margin: 8px 10px 8px; padding-top: 4px; overflow: hidden; border: 1px solid #333; border-radius: 6px; background: #171717; }
      #suggestions.visible { display: block; }
      .suggestion { display: grid; width: 100%; height: 42px; grid-template-columns: 14px minmax(0, 1fr); align-items: center; gap: 9px; padding: 5px 10px; border: 0; border-bottom: 1px solid #292929; background: transparent; color: #e5e5e5; text-align: left; cursor: pointer; }
      .suggestion:last-child { border-bottom: 0; }
      .suggestion:hover { background: #262626; }
      .suggestion-icon { color: #888; font-size: 12px; }
      .suggestion-copy { min-width: 0; }
      .suggestion-label, .suggestion-detail { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .suggestion-label { font-size: 12px; }
      .suggestion-detail { margin-top: 1px; color: #888; font-size: 10px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div id="tabs">
      <div id="brand" aria-label="CLA"><img src="../../assets/cla-tech-logo.svg" alt="CLA" /></div>
      <div id="tab-list"></div>
      <button class="icon-button new-tab" title="Nueva pestaña" aria-label="Nueva pestaña"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
      <div id="window-controls">
        <button class="window-control" data-window-action="minimize" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
        <button class="window-control" data-window-action="toggle-maximize" title="Maximizar" aria-label="Maximizar"><svg id="maximize-icon" viewBox="0 0 24 24"><path d="M5 5h14v14H5z" /></svg></button>
        <button class="window-control close-window" data-window-action="close" title="Cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
      </div>
    </div>
    <div id="bar">
      <button class="icon-button control" data-action="back" title="Atrás" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg></button>
      <button class="icon-button control" data-action="forward" title="Adelante" aria-label="Adelante"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg></button>
      <button class="icon-button control" data-action="reload" title="Recargar" aria-label="Recargar"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 3v6h-6" /></svg></button>
      <form><input id="address" aria-label="Dirección" autocomplete="off" placeholder="Buscar o escribir una dirección" /></form>
    </div>
    <div id="suggestions" role="listbox" aria-label="Sugerencias"></div>
    <script>
      const tabList = document.querySelector('#tab-list');
      const newTab = document.querySelector('.new-tab');
      const address = document.querySelector('#address');
      const suggestionsElement = document.querySelector('#suggestions');
      const maximizeIcon = document.querySelector('#maximize-icon');
      let state = { tabs: [], activeTabId: null };
      let draggedTabId = null;
      let suggestionRequest = 0;
      let suggestionTimer;

      function icon(path) { return `<svg viewBox="0 0 24 24"><path d="${path}" /></svg>`; }
      function render(nextState) {
        state = nextState;
        tabList.replaceChildren();
        for (const tab of state.tabs) {
          const element = document.createElement('button');
          element.className = `tab ${tab.id === state.activeTabId ? 'active' : ''} ${tab.loading ? 'loading' : ''}`;
          element.draggable = true;
          element.innerHTML = `<span class="tab-status"></span><span class="tab-title">${escapeHtml(tab.loading ? 'Cargando' : tab.title)}</span><span class="icon-button close" title="Cerrar pestaña">${icon('m6 6 12 12M18 6 6 18')}</span>`;
          element.addEventListener('click', () => window.browser.selectTab(tab.id));
          element.querySelector('.close').addEventListener('click', (event) => { event.stopPropagation(); window.browser.closeTab(tab.id); });
          element.addEventListener('dragstart', (event) => {
            draggedTabId = tab.id;
            element.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', String(tab.id));
          });
          element.addEventListener('dragend', () => {
            draggedTabId = null;
            tabList.querySelectorAll('.drag-before, .drag-after, .dragging').forEach((item) => item.classList.remove('drag-before', 'drag-after', 'dragging'));
          });
          element.addEventListener('dragover', (event) => {
            if (draggedTabId === null || draggedTabId === tab.id) return;
            event.preventDefault();
            const placeAfter = event.clientX > element.getBoundingClientRect().left + element.clientWidth / 2;
            tabList.querySelectorAll('.drag-before, .drag-after').forEach((item) => item.classList.remove('drag-before', 'drag-after'));
            element.classList.add(placeAfter ? 'drag-after' : 'drag-before');
            event.dataTransfer.dropEffect = 'move';
          });
          element.addEventListener('dragleave', () => element.classList.remove('drag-before', 'drag-after'));
          element.addEventListener('drop', (event) => {
            event.preventDefault();
            if (draggedTabId === null || draggedTabId === tab.id) return;
            const placeAfter = event.clientX > element.getBoundingClientRect().left + element.clientWidth / 2;
            window.browser.moveTab(draggedTabId, tab.id, placeAfter);
          });
          tabList.append(element);
        }
        const active = state.tabs.find((tab) => tab.id === state.activeTabId);
        if (active && document.activeElement !== address) address.value = active.url;
      }
      function escapeHtml(value) { const element = document.createElement('span'); element.textContent = value; return element.innerHTML; }
      function hideSuggestions() {
        suggestionRequest += 1;
        clearTimeout(suggestionTimer);
        suggestionsElement.replaceChildren();
        suggestionsElement.classList.remove('visible');
        window.browser.setSuggestionHeight(0);
      }
      function renderSuggestions(suggestions) {
        suggestionsElement.replaceChildren();
        if (!suggestions.length) return hideSuggestions();
        for (const suggestion of suggestions) {
          const option = document.createElement('button');
          option.className = 'suggestion';
          option.type = 'button';
          option.setAttribute('role', 'option');
          const icon = document.createElement('span');
          icon.className = 'suggestion-icon';
          icon.textContent = suggestion.kind === 'search' ? 'S' : 'O';
          const copy = document.createElement('span');
          copy.className = 'suggestion-copy';
          const label = document.createElement('span');
          label.className = 'suggestion-label';
          label.textContent = suggestion.label;
          const detail = document.createElement('span');
          detail.className = 'suggestion-detail';
          detail.textContent = suggestion.detail;
          copy.append(label, detail);
          option.append(icon, copy);
          option.addEventListener('mousedown', (event) => event.preventDefault());
          option.addEventListener('click', () => {
            address.value = suggestion.value;
            hideSuggestions();
            address.blur();
            window.browser.navigate(suggestion.value);
          });
          suggestionsElement.append(option);
        }
        suggestionsElement.classList.add('visible');
        window.browser.setSuggestionHeight(Math.min(280, suggestions.length * 42 + 22));
      }
      function requestSuggestions() {
        const query = address.value.trim();
        const request = ++suggestionRequest;
        clearTimeout(suggestionTimer);
        if (!query) return hideSuggestions();
        suggestionTimer = setTimeout(async () => {
          const suggestions = await window.browser.suggest(query);
          if (request === suggestionRequest && document.activeElement === address) renderSuggestions(suggestions);
        }, 160);
      }
      document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault();
        hideSuggestions();
        address.blur();
        window.browser.navigate(address.value);
      });
      address.addEventListener('input', requestSuggestions);
      address.addEventListener('focus', requestSuggestions);
      address.addEventListener('blur', () => setTimeout(hideSuggestions, 120));
      address.addEventListener('keydown', (event) => { if (event.key === 'Escape') { hideSuggestions(); address.blur(); } });
      document.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', () => window.browser.action(button.dataset.action)));
      document.querySelectorAll('[data-window-action]').forEach((button) => button.addEventListener('click', () => window.browser.windowAction(button.dataset.windowAction)));
      newTab.addEventListener('click', () => window.browser.action('new-tab'));
      window.browser.onState(render);
      window.browser.onWindowState(({ maximized }) => { maximizeIcon.innerHTML = maximized ? '<path d="M8 5h11v11M5 8h11v11H5z" />' : '<path d="M5 5h14v14H5z" />'; });
      window.browser.getState().then(render);
    </script>
  </body>
</html>
