<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLA Browser</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #000; color: #ededed; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-rows: 34px 42px auto auto; align-content: start; overflow: hidden; background: #000; user-select: none; }
      button { font: inherit; }
      svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      #tabs { position: relative; display: flex; align-items: stretch; min-width: 0; border-bottom: 1px solid #262626; -webkit-app-region: drag; }
      #tab-list { display: flex; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-app-region: drag; }
      #tab-list::-webkit-scrollbar { display: none; }
      .tab { -webkit-app-region: no-drag; position: relative; display: flex; flex: 0 0 176px; align-items: center; width: 176px; max-width: 24vw; min-width: 96px; padding-right: 5px; border-right: 1px solid #262626; background: #000; color: #888; transition: background .14s ease, color .14s ease; }
      .tab-select { display: flex; flex: 1; align-items: center; align-self: stretch; gap: 7px; min-width: 0; padding: 0 5px 0 11px; border: 0; background: transparent; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid #fafafa; outline-offset: -3px; }
      .tab:hover { background: #111; color: #ddd; }
      .tab.active { background: #171717; color: #fafafa; }
      .tab.active::before { position: absolute; right: 0; bottom: -1px; left: 0; height: 1px; background: #fafafa; content: ""; }
      .tab.dragging { opacity: .35; }
      .tab.drag-before { box-shadow: inset 2px 0 #fafafa; }
      .tab.drag-after { box-shadow: inset -2px 0 #fafafa; }
      .tab-status { width: 7px; height: 7px; flex: 0 0 auto; border: 1px solid #666; border-radius: 50%; transition: border-color .14s ease; }
      .tab.loading .tab-status { border-color: #fff #fff #555 #555; animation: spin .8s linear infinite; }
      .tab-title { overflow: hidden; flex: 1; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; letter-spacing: -0.01em; }
      .icon-button { display: inline-grid; width: 28px; height: 28px; place-items: center; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #a3a3a3; cursor: pointer; transition: background .14s ease, color .14s ease, transform .12s ease; }
       .icon-button:hover { background: #262626; color: #fff; }
       #ad-blocker { position: relative; }
       #ad-blocker.active { color: #8dd6a1; }
       #ad-blocker:not(.active) { color: #888; }
       #ad-blocker-count { position: absolute; right: 1px; bottom: 1px; min-width: 10px; color: inherit; font-size: 9px; font-variant-numeric: tabular-nums; line-height: 1; pointer-events: none; }
      .close { flex: 0 0 20px; width: 20px; height: 20px; opacity: 0; }
      .tab:hover .close, .tab.active .close, .tab:focus-within .close { opacity: 1; }
      .new-tab, .tab-scroll { -webkit-app-region: no-drag; flex: 0 0 28px; align-self: center; }
      .new-tab { margin-left: 4px; }
      .tab-scroll:disabled { opacity: .3; cursor: default; }
      .tab-scroll[hidden] { display: none; }
      #window-controls { display: flex; flex-shrink: 0; margin-left: auto; -webkit-app-region: no-drag; }
      .window-control { display: inline-grid; width: 46px; place-items: center; padding: 0; border: 0; background: transparent; color: #a3a3a3; cursor: pointer; transition: background .14s ease, color .14s ease; }
      .window-control:hover { background: #262626; color: #fff; }
      .window-control.close-window:hover { background: #e5484d; color: #fff; }
      .window-control svg { width: 13px; height: 13px; stroke-width: 1.5; }
      #bar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid #262626; background: #000; }
      .control { color: #888; }
      .control:active { transform: scale(.94); }
       form { position: relative; flex: 1; min-width: 0; }
       #address { width: 100%; height: 30px; padding: 0 38px 0 12px; border: 1px solid #333; border-radius: 6px; outline: none; background: #171717; color: #f5f5f5; font-size: 12px; letter-spacing: -0.01em; transition: border-color .12s, background .12s; }
       #address::placeholder { color: #777; }
       #address:disabled { color: #a1a1aa; cursor: default; opacity: 1; }
       #address:hover { border-color: #4a4a4a; }
       #address:focus { border-color: var(--address-accent, #fafafa); background: #0a0a0a; box-shadow: 0 0 0 2px #ffffff1f; }
       #bookmark-current { position: absolute; top: 1px; right: 1px; }
       #bookmark-current.saved { color: #f7c948; }
      #bookmark-current.saved svg { fill: currentColor; }
      #bookmarks { display: flex; height: 32px; align-items: center; gap: 2px; overflow: hidden; padding: 3px 8px; border-bottom: 1px solid #262626; background: #0a0a0a; }
      .bookmarks-hidden #bookmarks { display: none; }
      .bookmark-item { display: flex; width: 24px; height: 24px; align-items: center; justify-content: center; border-radius: 4px; color: #c7c7c7; }
      .bookmark { display: grid; width: 18px; height: 18px; place-items: center; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; }
      .bookmark:hover { background: #262626; color: #fff; }
       .bookmark-favicon { width: 14px; height: 14px; flex: 0 0 auto; }
       .bookmark-favicon.fallback { border: 1px solid currentColor; border-radius: 50%; opacity: .65; }
      .bookmarks-empty { padding: 0 8px; color: #777; font-size: 11px; }
      #suggestions { display: none; margin: 8px 10px 8px; padding-top: 4px; overflow: hidden; border: 1px solid #333; border-radius: 6px; background: #171717; }
      #suggestions.visible { display: block; }
      .suggestion { display: grid; width: 100%; height: 42px; grid-template-columns: 14px minmax(0, 1fr); align-items: center; gap: 9px; padding: 5px 10px; border: 0; border-bottom: 1px solid #292929; background: transparent; color: #e5e5e5; text-align: left; cursor: pointer; }
       .suggestion:last-child { border-bottom: 0; }
       .suggestion:hover, .suggestion.selected { background: #262626; }
      .suggestion-icon { color: #888; font-size: 12px; }
      .suggestion-copy { min-width: 0; }
      .suggestion-label, .suggestion-detail { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .suggestion-label { font-size: 12px; }
      .suggestion-detail { margin-top: 1px; color: #888; font-size: 10px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div id="tabs">
      <button id="tabs-previous" class="icon-button tab-scroll" title="Ver pestañas anteriores" aria-label="Ver pestañas anteriores" hidden><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg></button>
      <div id="tab-list" role="tablist" aria-label="Pestañas"></div>
      <button id="tabs-next" class="icon-button tab-scroll" title="Ver pestañas siguientes" aria-label="Ver pestañas siguientes" hidden><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg></button>
      <button class="icon-button new-tab" title="Nueva pestaña" aria-label="Nueva pestaña"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
      <div id="window-controls">
        <button class="window-control" data-window-action="minimize" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
        <button class="window-control" data-window-action="toggle-maximize" title="Maximizar" aria-label="Maximizar"><svg id="maximize-icon" viewBox="0 0 24 24"><path d="M5 5h14v14H5z" /></svg></button>
        <button class="window-control close-window" data-window-action="close" title="Cerrar ventana" aria-label="Cerrar ventana"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
      </div>
    </div>
    <div id="bar">
      <button class="icon-button control" data-action="back" title="Atrás" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg></button>
      <button class="icon-button control" data-action="forward" title="Adelante" aria-label="Adelante"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg></button>
        <button class="icon-button control" data-action="reload" title="Recargar" aria-label="Recargar"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 3v6h-6" /></svg></button>
        <form><input id="address" aria-label="Dirección" autocomplete="off" placeholder="Buscar o escribir una dirección" /><button id="bookmark-current" class="icon-button control" type="button" data-action="toggle-bookmark" title="Añadir o quitar marcador" aria-label="Añadir o quitar marcador"><svg viewBox="0 0 24 24"><path d="m12 3 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.92 1.06-6.2L3 9.53l6.22-.9L12 3z" /></svg></button></form>
        <button id="ad-blocker" class="icon-button control" data-action="toggle-ad-blocker" title="Activar bloqueador" aria-label="Activar bloqueador"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.7 3.1 8.5 7.5 9.5 4.4-1 7.5-4.8 7.5-9.5V6L12 3z" /><path d="m8.5 12 2.2 2.2 4.8-4.8" /></svg><span id="ad-blocker-count" hidden></span></button>
     </div>
     <div id="bookmarks" aria-label="Barra de marcadores"></div>
     <div id="suggestions" role="listbox" aria-label="Sugerencias"></div>
    <script>
      const tabList = document.querySelector('#tab-list');
      const newTab = document.querySelector('.new-tab');
       const address = document.querySelector('#address');
       const bookmarksElement = document.querySelector('#bookmarks');
        const bookmarkCurrent = document.querySelector('#bookmark-current');
       const adBlockerButton = document.querySelector('#ad-blocker');
       const adBlockerCount = document.querySelector('#ad-blocker-count');
      const suggestionsElement = document.querySelector('#suggestions');
      const maximizeIcon = document.querySelector('#maximize-icon');
      let state = { tabs: [], activeTabId: null };
      let draggedTabId = null;
      const tabNodes = new Map();
      let rovingTabId = null;
      const previousTabs = document.querySelector('#tabs-previous');
      const nextTabs = document.querySelector('#tabs-next');
      let lastTabListWidth = 0;
       let suggestionRequest = 0;
       let suggestionTimer;
       let suggestions = [];
       let selectedSuggestionIndex = -1;

      function icon(path) { return `<svg viewBox="0 0 24 24"><path d="${path}" /></svg>`; }
       function render(nextState) {
         const previousState = state;
         const focused = document.activeElement;
         const focusedId = Number(focused.closest('[data-tab-id]')?.dataset.tabId);
         const removedFocus = focusedId && !nextState.tabs.some((tab) => tab.id === focusedId);
         state = nextState;
         document.documentElement.style.setProperty('--address-accent', state.addressAccentColor || '#fafafa');
         for (const [id, element] of tabNodes) {
           if (!state.tabs.some((tab) => tab.id === id)) {
             element.remove();
             tabNodes.delete(id);
           }
         }
         if (removedFocus) {
           const index = previousState.tabs.findIndex((tab) => tab.id === focusedId);
           rovingTabId = focusedId === previousState.activeTabId ? state.activeTabId : state.tabs[Math.min(index, state.tabs.length - 1)]?.id;
         } else if (!tabNodes.has(rovingTabId) || (!focusedId && previousState.activeTabId !== state.activeTabId)) {
           rovingTabId = state.activeTabId;
         }
         let position = 0;
         for (const tab of state.tabs) {
           let element = tabNodes.get(tab.id);
           if (!element) {
             element = document.createElement('div');
             element.dataset.tabId = tab.id;
             element.setAttribute('role', 'presentation');
             element.draggable = true;
             element.innerHTML = `<button type="button" class="tab-select" role="tab"><span class="tab-status" aria-hidden="true"></span><span class="tab-title"></span></button><button type="button" class="icon-button close">${icon('m6 6 12 12M18 6 6 18')}</button>`;
             element.querySelector('.tab-select').addEventListener('click', () => window.browser.selectTab(tab.id));
             element.querySelector('.close').addEventListener('click', () => window.browser.closeTab(tab.id, { focus: 'toolbar' }));
             element.addEventListener('dragstart', (event) => {
               draggedTabId = tab.id;
               element.classList.add('dragging');
               event.dataTransfer.effectAllowed = 'move';
               event.dataTransfer.setData('text/plain', String(tab.id));
             });
             element.addEventListener('dragend', () => {
               draggedTabId = null;
               tabList.querySelectorAll('.drag-before, .drag-after, .dragging').forEach((item) => item.classList.remove('drag-before', 'drag-after', 'dragging'));
             });
             element.addEventListener('dragover', (event) => {
               if (draggedTabId === null || draggedTabId === tab.id) return;
               event.preventDefault();
               const placeAfter = event.clientX > element.getBoundingClientRect().left + element.clientWidth / 2;
               tabList.querySelectorAll('.drag-before, .drag-after').forEach((item) => item.classList.remove('drag-before', 'drag-after'));
               element.classList.add(placeAfter ? 'drag-after' : 'drag-before');
               event.dataTransfer.dropEffect = 'move';
             });
             element.addEventListener('dragleave', () => element.classList.remove('drag-before', 'drag-after'));
             element.addEventListener('drop', (event) => {
               event.preventDefault();
               if (draggedTabId === null || draggedTabId === tab.id) return;
               const placeAfter = event.clientX > element.getBoundingClientRect().left + element.clientWidth / 2;
               window.browser.moveTab(draggedTabId, tab.id, placeAfter);
             });
             tabNodes.set(tab.id, element);
           }
           element.classList.toggle('active', tab.id === state.activeTabId);
           element.classList.toggle('loading', Boolean(tab.loading));
           element.classList.add('tab');
           const select = element.querySelector('.tab-select');
           select.setAttribute('aria-selected', String(tab.id === state.activeTabId));
           select.tabIndex = tab.id === rovingTabId ? 0 : -1;
           select.title = tab.title || 'Nueva pestaña';
           select.setAttribute('aria-label', select.title);
           element.querySelector('.tab-title').textContent = tab.loading ? 'Cargando' : select.title;
           const close = element.querySelector('.close');
           close.title = `Cerrar pestaña: ${select.title}`;
           close.setAttribute('aria-label', close.title);
           const current = tabList.children[position++];
           if (current !== element) {
             // Atomic moves preserve DOM focus and drag identity on reorder.
             if (element.isConnected) tabList.moveBefore(element, current || null);
             else tabList.insertBefore(element, current || null);
           }
         }
         if (removedFocus) tabNodes.get(rovingTabId)?.querySelector('.tab-select').focus({ preventScroll: true });
         if (previousState.activeTabId !== state.activeTabId) revealTab(state.activeTabId);
         else if (focusedId && previousState.tabs.findIndex((tab) => tab.id === focusedId) !== state.tabs.findIndex((tab) => tab.id === focusedId)) revealTab(focusedId);
         updateOverflow();
         const active = state.tabs.find((tab) => tab.id === state.activeTabId);
         if (active && (active.restricted || document.activeElement !== address)) address.value = active.restricted ? 'Sitio restringido' : active.url;
         address.disabled = Boolean(active?.restricted);
          bookmarkCurrent.classList.toggle('saved', Boolean(active && state.bookmarks.some((bookmark) => bookmark.url === active.url)));
          const adBlocker = state.adBlocker || { enabled: false, mode: 'lightweight', blockedRequests: 0, siteException: false };
          adBlockerButton.classList.toggle('active', adBlocker.enabled && !adBlocker.siteException);
          adBlockerButton.title = adBlocker.siteException
            ? 'Anuncios permitidos en este sitio'
            : adBlocker.enabled
              ? `Bloqueador activo (${adBlocker.mode === 'reinforced' ? 'reforzado' : 'ligero'})`
              : 'Activar bloqueador';
          adBlockerButton.setAttribute('aria-label', adBlockerButton.title);
          adBlockerCount.hidden = !adBlocker.blockedRequests;
          adBlockerCount.textContent = adBlocker.blockedRequests || '';
          document.body.classList.toggle('bookmarks-hidden', !state.bookmarksVisible);
         renderBookmarks();
       }
       function revealTab(id) {
         const element = tabNodes.get(id);
         if (!element) return;
         const bounds = element.getBoundingClientRect();
         const viewport = tabList.getBoundingClientRect();
         if (bounds.left < viewport.left) tabList.scrollLeft += bounds.left - viewport.left;
         else if (bounds.right > viewport.right) tabList.scrollLeft += bounds.right - viewport.right;
       }
       function updateOverflow() {
         // Count the slots occupied by visible arrows back into the available width.
         // Summing tab widths avoids scrollWidth's viewport floor when all tabs fit.
         const available = tabList.getBoundingClientRect().width + previousTabs.getBoundingClientRect().width + nextTabs.getBoundingClientRect().width;
         const content = [...tabList.children].reduce((width, tab) => width + tab.getBoundingClientRect().width, 0);
         const overflow = content > available;
         if (previousTabs.hidden === overflow) {
           const restoreFocus = !overflow && document.hasFocus() && [previousTabs, nextTabs].includes(document.activeElement);
           previousTabs.hidden = nextTabs.hidden = !overflow;
           if (restoreFocus) tabNodes.get(rovingTabId || state.activeTabId)?.querySelector('.tab-select').focus({ preventScroll: true });
         }
         const width = tabList.clientWidth;
         if (width !== lastTabListWidth) {
           lastTabListWidth = width;
           const focusedId = document.hasFocus() && Number(document.activeElement.closest('[data-tab-id]')?.dataset.tabId);
           revealTab(focusedId || state.activeTabId);
         }
         previousTabs.disabled = tabList.scrollLeft <= 1;
         nextTabs.disabled = tabList.scrollLeft + tabList.clientWidth >= tabList.scrollWidth - 1;
       }
       previousTabs.addEventListener('click', () => { tabList.scrollLeft -= Math.max(96, tabList.clientWidth * .8); });
       nextTabs.addEventListener('click', () => { tabList.scrollLeft += Math.max(96, tabList.clientWidth * .8); });
       tabList.addEventListener('scroll', updateOverflow);
       new ResizeObserver(updateOverflow).observe(tabList);
       tabList.addEventListener('focusin', (event) => {
         const element = event.target.closest('[data-tab-id]');
         if (!element) return;
         rovingTabId = Number(element.dataset.tabId);
         for (const [id, node] of tabNodes) node.querySelector('.tab-select').tabIndex = id === rovingTabId ? 0 : -1;
         revealTab(rovingTabId);
       });
       tabList.addEventListener('keydown', (event) => {
         if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.getAttribute('role') !== 'tab') return;
         const id = Number(event.target.closest('[data-tab-id]').dataset.tabId);
         const index = state.tabs.findIndex((tab) => tab.id === id);
         let destination;
         if (event.key === 'ArrowLeft') destination = (index - 1 + state.tabs.length) % state.tabs.length;
         else if (event.key === 'ArrowRight') destination = (index + 1) % state.tabs.length;
         else if (event.key === 'Home') destination = 0;
         else if (event.key === 'End') destination = state.tabs.length - 1;
         else if (event.key === 'Enter' || event.key === ' ') window.browser.selectTab(id, { focus: 'toolbar' });
         else if (event.key === 'Delete') window.browser.closeTab(id, { focus: 'toolbar' });
         else return;
         event.preventDefault();
         if (destination !== undefined) tabNodes.get(state.tabs[destination].id).querySelector('.tab-select').focus({ preventScroll: true });
       });
         function fallbackFavicon(url) {
           try {
             const page = new URL(url);
             if (page.hostname === 'mail.google.com') return 'https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico';
             return page.protocol === 'http:' || page.protocol === 'https:' ? new URL('/favicon.ico', page).toString() : '';
           } catch {
             return '';
          }
        }
        function renderBookmarks() {
         bookmarksElement.replaceChildren();
         if (!state.bookmarks.length) {
           const empty = document.createElement('span');
           empty.className = 'bookmarks-empty';
           empty.textContent = 'Aún no hay marcadores';
           bookmarksElement.append(empty);
           return;
         }
         for (const bookmark of state.bookmarks) {
           const item = document.createElement('div');
            item.className = 'bookmark-item';
           item.title = bookmark.url;
            const open = document.createElement('button');
            open.className = 'bookmark';
            open.type = 'button';
            open.title = bookmark.title || bookmark.url;
             open.setAttribute('aria-label', bookmark.title || bookmark.url);
             const fallback = fallbackFavicon(bookmark.url);
             const addGenericIcon = () => {
               if (open.querySelector('.bookmark-favicon')) return;
               const generic = document.createElement('span');
               generic.className = 'bookmark-favicon fallback';
               generic.setAttribute('aria-hidden', 'true');
               open.prepend(generic);
             };
             if (bookmark.favicon || fallback) {
               const favicon = document.createElement('img');
               favicon.className = 'bookmark-favicon';
               favicon.src = bookmark.favicon || fallback;
               favicon.alt = '';
               favicon.addEventListener('error', () => {
                if (fallback && favicon.src !== fallback) favicon.src = fallback;
                else { favicon.remove(); addGenericIcon(); }
               });
               open.append(favicon);
             } else addGenericIcon();
            const label = document.createElement('span');
            label.hidden = true;
            label.textContent = bookmark.title || bookmark.url;
            open.append(label);
            open.addEventListener('click', () => window.browser.navigate(bookmark.url));
            item.append(open);
           bookmarksElement.append(item);
         }
       }
       function hideSuggestions() {
         suggestionRequest += 1;
         clearTimeout(suggestionTimer);
         suggestions = [];
         selectedSuggestionIndex = -1;
         suggestionsElement.replaceChildren();
        suggestionsElement.classList.remove('visible');
        window.browser.setSuggestionHeight(0);
      }
       function renderSuggestions(items) {
         suggestions = items;
         selectedSuggestionIndex = -1;
         suggestionsElement.replaceChildren();
         if (!items.length) return hideSuggestions();
        for (const suggestion of items) {
          const option = document.createElement('button');
          option.className = 'suggestion';
          option.type = 'button';
          option.setAttribute('role', 'option');
          const icon = document.createElement('span');
          icon.className = 'suggestion-icon';
          icon.textContent = suggestion.kind === 'search' ? 'S' : 'O';
          const copy = document.createElement('span');
          copy.className = 'suggestion-copy';
          const label = document.createElement('span');
          label.className = 'suggestion-label';
          label.textContent = suggestion.label;
          const detail = document.createElement('span');
          detail.className = 'suggestion-detail';
          detail.textContent = suggestion.detail;
          copy.append(label, detail);
          option.append(icon, copy);
          option.addEventListener('mousedown', (event) => event.preventDefault());
           option.addEventListener('click', () => navigateSuggestion(suggestion));
           suggestionsElement.append(option);
        }
        suggestionsElement.classList.add('visible');
         window.browser.setSuggestionHeight(Math.min(280, items.length * 42 + 22));
       }
       function navigateSuggestion(suggestion) {
         address.value = suggestion.value;
         hideSuggestions();
         address.blur();
         window.browser.navigate(suggestion.value);
       }
       function selectSuggestion(index) {
         if (!suggestions.length) return;
         selectedSuggestionIndex = (index + suggestions.length) % suggestions.length;
         suggestionsElement.querySelectorAll('.suggestion').forEach((option, optionIndex) => {
           const selected = optionIndex === selectedSuggestionIndex;
           option.classList.toggle('selected', selected);
           option.setAttribute('aria-selected', String(selected));
         });
         suggestionsElement.children[selectedSuggestionIndex]?.scrollIntoView({ block: 'nearest' });
       }
       function requestSuggestions() {
        const query = address.value.trim();
        const request = ++suggestionRequest;
        clearTimeout(suggestionTimer);
        if (!query) return hideSuggestions();
        suggestionTimer = setTimeout(async () => {
          const suggestions = await window.browser.suggest(query);
          if (request === suggestionRequest && document.activeElement === address) renderSuggestions(suggestions);
         }, 160);
       }
       document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault();
        hideSuggestions();
        address.blur();
        window.browser.navigate(address.value);
      });
      address.addEventListener('input', requestSuggestions);
      address.addEventListener('focus', requestSuggestions);
      address.addEventListener('blur', () => setTimeout(hideSuggestions, 120));
       address.addEventListener('keydown', (event) => {
         if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
           if (!suggestions.length) return;
           event.preventDefault();
           selectSuggestion(selectedSuggestionIndex + (event.key === 'ArrowDown' ? 1 : -1));
         } else if (event.key === 'Enter' && selectedSuggestionIndex !== -1) {
           event.preventDefault();
           navigateSuggestion(suggestions[selectedSuggestionIndex]);
         } else if (event.key === 'Escape') {
           hideSuggestions();
           address.blur();
         }
       });
       document.addEventListener('keydown', (event) => {
         if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'h') {
           event.preventDefault();
           window.browser.action('show-history');
         }
       });
       document.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', () => window.browser.action(button.dataset.action)));
       document.querySelectorAll('[data-window-action]').forEach((button) => button.addEventListener('click', () => window.browser.windowAction(button.dataset.windowAction)));
       newTab.addEventListener('click', () => window.browser.action('new-tab'));
       window.browser.onState(render);
        window.browser.onWindowState(({ maximized }) => {
          maximizeIcon.innerHTML = maximized ? '<path d="M8 5h11v11M5 8h11v11H5z" />' : '<path d="M5 5h14v14H5z" />';
          const button = maximizeIcon.closest('button');
          button.title = maximized ? 'Restaurar ventana' : 'Maximizar';
          button.setAttribute('aria-label', button.title);
        });
       window.browser.getState().then(render);
    </script>
  </body>
</html>
