<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marcadores</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --bg: #0b0b0c; --text: #f4f4f5; --muted: #a1a1aa; --subtle: #71717a; --border: #27272a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
      main { width: min(620px, calc(100% - 40px)); margin: 0 auto; padding: 96px 0 48px; }
      .eyebrow { margin: 0 0 14px; color: var(--subtle); font-size: 13px; font-weight: 500; }
      h1 { margin: 0; font-size: clamp(30px, 6vw, 42px); font-weight: 600; line-height: 1.08; letter-spacing: -.045em; }
      .intro { margin: 18px 0 28px; color: var(--muted); font-size: 15px; line-height: 1.7; }
      ul { margin: 0; padding: 0; border-top: 1px solid var(--border); list-style: none; }
      li { border-bottom: 1px solid var(--border); }
      button { display: grid; width: 100%; padding: 16px 0; border: 0; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; grid-template-columns: 20px minmax(0, 1fr); align-items: center; gap: 12px; }
      button:hover, button:focus-visible { color: white; outline: 2px solid #71717a; outline-offset: 2px; }
      button span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button .url { margin-top: 5px; color: var(--muted); font-size: 12px; }
      .bookmark-icon { width: 20px; height: 20px; }
      .bookmark-icon.fallback { width: 14px; height: 14px; margin: 0 3px; border: 1px solid currentColor; border-radius: 50%; opacity: .65; }
      .empty { color: var(--muted); }
      @media (max-width: 640px) { main { padding-top: 56px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Marcadores guardados</p>
      <h1>Todos los marcadores</h1>
      <p class="intro">Tus páginas guardadas, en el mismo orden que la barra de marcadores.</p>
      <ul id="bookmarks" aria-label="Todos los marcadores"></ul>
    </main>
    <script>
      function fallbackFavicon(url) {
        try {
          const page = new URL(url);
          if (page.hostname === 'mail.google.com') return 'https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico';
          return page.protocol === 'http:' || page.protocol === 'https:' ? new URL('/favicon.ico', page).toString() : '';
        } catch {
          return '';
        }
      }
      (async () => {
        const list = document.querySelector('#bookmarks');
        const bookmarks = await window.claBrowserLocalPage.getBookmarks();
        if (!Array.isArray(bookmarks) || !bookmarks.length) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'Aún no hay marcadores guardados.';
          list.append(empty);
          return;
        }
        for (const bookmark of bookmarks) {
          const item = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-label', `${bookmark.title} — ${bookmark.url}`);
          const fallback = fallbackFavicon(bookmark.url);
          button.dataset.faviconSrc = fallback;
          const addGenericIcon = () => {
            const generic = document.createElement('span');
            generic.className = 'bookmark-icon fallback';
            generic.setAttribute('aria-hidden', 'true');
            button.prepend(generic);
          };
          if (fallback) {
            const icon = document.createElement('img');
            icon.className = 'bookmark-icon';
            icon.alt = '';
            icon.setAttribute('aria-hidden', 'true');
            icon.src = fallback;
            icon.addEventListener('error', () => {
              icon.remove();
              addGenericIcon();
            });
            button.append(icon);
          } else addGenericIcon();
          const text = document.createElement('span');
          const title = document.createElement('span');
          title.className = 'bookmark-title';
          title.textContent = bookmark.title;
          const url = document.createElement('span');
          url.className = 'url';
          url.textContent = bookmark.url;
          text.append(title, url);
          button.append(text);
          button.addEventListener('click', () => window.claBrowserLocalPage.openBookmark(bookmark.url));
          item.append(button);
          list.append(item);
        }
      })();
    </script>
  </body>
</html>
