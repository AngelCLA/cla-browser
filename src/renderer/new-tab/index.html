<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva pestaña</title>
    <style>
      :root { color-scheme: dark; background: #000; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; overflow: hidden; background: radial-gradient(circle at center, #171717 0, #000 55%); }
      img { width: min(280px, 44vw); height: auto; -webkit-user-drag: none; user-select: none; filter: drop-shadow(0 0 32px #c33dff30); animation: appear .55s cubic-bezier(.16, 1, .3, 1) both; }
      .institutional-search { display: none; }
      body.institutional { display: block; }
      body.institutional main { position: relative; width: 100%; height: 100vh; }
      body.institutional img { position: absolute; right: 0; bottom: calc(50% + 56px); left: 0; width: min(280px, 58vw); margin: auto; }
      body.institutional .institutional-search { position: absolute; top: 50%; right: 0; left: 0; display: block; width: min(620px, calc(100vw - 40px)); margin: 0 auto; transform: translateY(-50%); }
      .institutional-search input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #3f3f46; border-radius: 9px; outline: 0; background: #18181b; color: #f5f5f5; font: 14px Inter, ui-sans-serif, system-ui, sans-serif; box-shadow: 0 24px 80px #0009; transition: border-color .12s, box-shadow .12s; }
      .institutional-search input::placeholder { color: #a1a1aa; }
      .institutional-search input:focus { border-color: #fafafa; box-shadow: 0 0 0 2px #ffffff1f, 0 24px 80px #0009; }
      .institutional-credit { display: none; }
      body.institutional .institutional-credit { position: fixed; bottom: 24px; left: 26px; display: block; color: #a1a1aa; font: 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      body.institutional .institutional-tech-credit { right: 26px; left: auto; }
      @keyframes appear { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @media (prefers-reduced-motion: reduce) { img { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="../../assets/cla-browser.svg" alt="CLA Browser" />
      <form class="institutional-search" role="search">
        <input aria-label="Buscar en la web" autocomplete="off" placeholder="Buscar en la web o escribir una dirección" />
      </form>
    </main>
    <span class="institutional-credit">Impulsado por CLA Browser</span>
    <span class="institutional-credit institutional-tech-credit">Desarrollado por CLA Tech</span>
    <script>
      const institutional = new URLSearchParams(location.search).get('edition') === 'institutional';
      if (institutional) {
        document.body.classList.add('institutional');
        const input = document.querySelector('.institutional-search input');
        document.querySelector('.institutional-search').addEventListener('submit', (event) => {
          event.preventDefault();
          const value = input.value.trim();
          if (!value) return input.focus();
          location.href = /^[a-z][a-z\d+.-]*:/i.test(value)
            ? value
            : (value.includes('.') || value === 'localhost'
              ? `https://${value}`
              : `https://www.google.com/search?q=${encodeURIComponent(value)}`);
        });
        input.focus();
      }
    </script>
  </body>
</html>
