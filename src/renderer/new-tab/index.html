<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva pestaña</title>
    <style>
      :root { color-scheme: dark; background: #000; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; overflow: hidden; background: radial-gradient(circle at center, #171717 0, #000 55%); }
      img { width: min(280px, 44vw); height: auto; filter: drop-shadow(0 0 32px #c33dff30); animation: appear .55s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes appear { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @media (prefers-reduced-motion: reduce) { img { animation: none; } }
    </style>
  </head>
  <body>
    <img src="../../assets/cla-browser.svg" alt="CLA Browser" />
  </body>
</html>
