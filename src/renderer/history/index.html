<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Historial</title>
    <style>
      :root { color-scheme: dark; background: #000; color: #f5f5f5; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: #000; }
      main { width: min(760px, calc(100vw - 40px)); margin: 54px auto; }
      h1 { margin: 0 0 24px; font-size: 24px; letter-spacing: -.03em; }
      #entries { display: grid; gap: 4px; }
      a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 12px 14px; border: 1px solid transparent; border-radius: 7px; color: inherit; text-decoration: none; }
      a:hover { border-color: #3f3f46; background: #18181b; }
      .title, .url { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .title { font-size: 14px; }
      .url, time, #empty { margin-top: 3px; color: #a1a1aa; font-size: 12px; }
      time { align-self: center; margin: 0; white-space: nowrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>Historial</h1>
      <div id="entries"></div>
      <p id="empty" hidden>No hay historial reciente.</p>
    </main>
    <script>
      const entries = document.querySelector('#entries');
      const empty = document.querySelector('#empty');
      window.claBrowserHistory.getEntries().then((history) => {
        empty.hidden = history.length > 0;
        for (const entry of history) {
          const link = document.createElement('a');
          link.href = entry.url;
          const text = document.createElement('span');
          const title = document.createElement('span');
          const url = document.createElement('span');
          title.className = 'title';
          title.textContent = entry.title;
          url.className = 'url';
          url.textContent = entry.url;
          text.append(title, url);
          const visitedAt = document.createElement('time');
          visitedAt.dateTime = new Date(entry.visitedAt).toISOString();
          visitedAt.textContent = new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium', timeStyle: 'short' }).format(entry.visitedAt);
          link.append(text, visitedAt);
          entries.append(link);
        }
      });
    </script>
  </body>
</html>
